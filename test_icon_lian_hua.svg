<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="0.5"/></filter>
  </defs>
  <rect x="1" y="1" width="38" height="38" rx="5" fill="url(#bg)" stroke="#a0a0a0" stroke-width="1.5"/>
  
  <!-- 莲花 — 江东才女/法师 -->
  <text x="20" y="14" text-anchor="middle" font-size="10">🌸</text>
  <circle cx="20" cy="24" r="6" fill="none" stroke="#fbbf24" stroke-width="0.8" opacity="0.6"/>
  <text x="20" y="27" text-anchor="middle" font-size="5" fill="#fbbf24">花瓣</text>
  <!-- 费用宝石 -->
