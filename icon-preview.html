<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英雄图标预览 — 38武将全览</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d1117; color:#c9d1d9; font-family:"Microsoft YaHei",sans-serif; padding:16px; }
h1 { text-align:center; margin-bottom:6px; font-size:20px; color:#f0f6fc; }
.subtitle { text-align:center; color:#8b949e; font-size:12px; margin-bottom:20px; }
.section-title { color:#f0f6fc; font-size:15px; margin:18px 0 10px; padding-left:10px; border-left:3px solid; }
.grid { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
.card { background:#161b22; border-radius:8px; padding:10px; width:100px; text-align:center; border:1px solid #30363d; transition:transform .15s,border-color .15s; }
.card:hover { transform:translateY(-2px); border-color:#58a6ff; }
.card img { width:48px; height:48px; border-radius:6px; margin-bottom:6px; object-fit:contain; display:block; margin-left:auto; margin-right:auto; }
.card .name { font-size:12px; color:#e6edf3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card .meta { font-size:10px; color:#8b949e; margin-top:2px; }
.card .tags { font-size:9px; color:#58a6ff; margin-top:2px; line-height:1.3; }
</style>
</head>
<body>
<h1>🎨 三国自走棋 · 英雄图标预览</h1>
<p class="subtitle">38 张武将卡 Canvas PNG 图标 — 全平台兼容（含微信浏览器/小程序WebView）</p>
<div id="app">生成中...</div>
<script src="js/data.js"></script>
<script src="js/icon-builder.js"></script>
<script>
(function() {
    try {
        if (typeof ICONS === 'undefined') throw new Error('icon-builder.js 未加载');
        if (typeof HEROES === 'undefined') throw new Error('data.js 未加载');

        ICONS.buildAllIcons(HEROES);

        var groups = {1:[], 2:[], 3:[], 4:[], 5:[]};
        var costColors = {1:'#8b7355', 2:'#a0a0a0', 3:'#3b82f6', 4:'#a855f7', 5:'#ffd700'};
        var costNames = {1:'1费 白', 2:'2费 绿', 3:'3费 蓝', 4:'4费 紫', 5:'5费 金'};

        for (var i = 0; i < HEROES.length; i++) {
            var c = HEROES[i].cost;
            groups[c] = groups[c] || [];
            groups[c].push(HEROES[i]);
        }

        var html = '';
        for (var cost = 1; cost <= 5; cost++) {
            var heroes = groups[cost];
            html += '<div class="section-title" style="border-left-color:' + costColors[cost] + '">' + costNames[cost] + ' (' + heroes.length + '张)</div>';
            html += '<div class="grid">';
            for (var j = 0; j < heroes.length; j++) {
                var h = heroes[j];
                var faction = 'wei';
                var syns = h.synergies || [];
                for (var k = 0; k < syns.length; k++) {
                    if (syns[k] === 'wei' || syns[k] === 'shu' || syns[k] === 'wu' || syns[k] === 'qun') {
                        faction = syns[k]; break;
                    }
                }
                var factionColors = {wei:'#3b82f6', shu:'#22c55e', wu:'#ef4444', qun:'#f59e0b'};
                var tagStr = h.tags ? h.tags.slice(0,3).join(' · ') : '';
                var synNames = {wei:'魏',shu:'蜀',wu:'吴',qun:'群',warrior:'战士',mage:'法师',tank:'坦克',archer:'弓手',assassin:'刺客',support:'辅助'};
                var synParts = [];
                for (var m = 0; m < syns.length; m++) {
                    synParts.push(synNames[syns[m]] || syns[m]);
                }
                var synStr = synParts.join('/');

                html += '<div class="card">';
                if (h.iconPNG) {
                    html += '<img src="' + h.iconPNG + '" alt="' + h.name + '" width="48" height="48" onerror="this.outerHTML=\\'<span style=font-size:28px;display:block;text-align:center;line-height:48px>' + (h.icon || '?') + '</span>\\'">';
                } else {
                    html += '<span style="font-size:28px;display:block;text-align:center;line-height:48px">' + (h.icon || '?') + '</span>';
                }
                html += '<div class="name" style="color:' + (factionColors[faction] || '#fff') + '">' + h.name + '</div>';
                html += '<div class="meta">' + synStr + '</div>';
                if (tagStr) html += '<div class="tags">' + tagStr + '</div>';
                html += '</div>';
            }
            html += '</div>';
        }

        document.getElementById('app').innerHTML = html;
    } catch(e) {
        document.getElementById('app').innerHTML =
            '<div style="text-align:center;padding:40px;color:#f85149;">' +
            '<h3>⚠️ 生成失败</h3>' +
            '<p style="font-size:13px;color:#8b949e;word-break:break-all;">' + e.message + '</p>' +
            '</div>';
    }
})();
</script>
</body>
</html>
